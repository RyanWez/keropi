[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keropi"
version = "0.2.0"
description = "Telegram bot that turns Myanmar mobile numbers into KBZ Pay / WavePay payment QR codes"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.31,<4",
    "aiohttp>=3.14,<4",
    "qrcode>=8.2,<9",
    "pillow>=12.0,<13",
    "python-dotenv>=1.2,<2",
    # Only the owner-only /decode command needs this; it is imported lazily so a
    # deployment without it still runs.
    "zxing-cpp>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.setuptools.package-data]
"bot" = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/images/*.png"]
"bot.web" = ["index.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
